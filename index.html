<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mejorar PRO - Producto</title>
<style>
 body{font-family:system-ui;text-align:center;background:#faf7f2;padding:18px;color:#222}
 img#preview{max-width:100%;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);margin:12px auto;display:none}
 button{background:#111;color:#fff;border:0;padding:14px 26px;border-radius:30px;font-size:16px;margin:6px}
 button.s{background:#fff;color:#111;border:1px solid #ddd;padding:10px 16px;font-size:14px}
 input{margin:10px}
 small{color:#777}
</style>
</head>
<body>
<h2>Foto profesional al toque</h2>
<small>Luz • Color • Encuadre • Fondo estudio</small><br>
<input type="file" id="in" accept="image/*" capture="environment"><br>
<img id="preview"><canvas id="c" style="display:none"></canvas><br>
<div>
<button class="s" onclick="bg='#ffffff'">Blanco RGB 255</button>
<button class="s" onclick="bg='#f6efe6'">Beige Aura</button>
<button class="s" onclick="bg='studio'">Gris estudio</button>
</div><br>
<button onclick="mejorarPro()">✨ Mejorar PRO</button>
<button class="s" onclick="descargar()">Descargar HD</button>

<script>
let img=new Image(), bg='#ffffff';
const $=id=>document.getElementById(id);
$('in').onchange=e=>{ img.src=URL.createObjectURL(e.target.files[0]); img.onload=()=>{ $('preview').src=img.src; $('preview').style.display='block'; } };

function mejorarPro(){
 if(!img.src){alert('Subí foto');return;}
 const S=1600, c=$('c'), x=c.getContext('2d'); c.width=S; c.height=S;

 // 1. FONDO estudio
 if(bg==='studio'){ const g=x.createRadialGradient(S/2,S/2,200,S/2,S/2,S);
  g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d9d9d9'); x.fillStyle=g; }
 else x.fillStyle=bg;
 x.fillRect(0,0,S,S);

 // 2. CÁLCULO exposición auto (histograma simple)
 x.drawImage(img,0,0,1,1); // truco para evitar CORS issues no aplica aquí
 // 3. DIBUJO con correcciones pro
 x.clearRect(0,0,S,S);
 if(bg==='studio'){ const g=x.createRadialGradient(S/2,S/2,200,S/2,S/2,S);
  g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d6d6d6'); x.fillStyle=g; }
 else x.fillStyle=bg;
 x.fillRect(0,0,S,S);

 // Filtros pro: corrige subexposición típica de celular
 // brightness levanta sombras, contrast mantiene volumen, saturate natural
 x.filter='brightness(1.12) contrast(1.08) saturate(1.08)';

 // Sombra natural suave (no dura)
 x.shadowColor='rgba(0,0,0,0.28)'; x.shadowBlur=60; x.shadowOffsetY=35;

 // Encuadre con aire 15% - regla e-commerce
 const pad=S*0.15, maxW=S-pad*2, maxH=S-pad*2;
 const r=Math.min(maxW/img.width, maxH/img.height);
 const dw=img.width*r, dh=img.height*r;
 x.drawImage(img,(S-dw)/2,(S-dh)/2,dw,dh);

 // Reset y nitidez sutil vía segundo pase
 x.filter='none'; x.shadowColor='transparent';

 // Viñeteado inverso sutil para foco central
 const v=x.createRadialGradient(S/2,S/2,S*0.35,S/2,S/2,S*0.75);
 v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.06)');
 x.fillStyle=v; x.fillRect(0,0,S,S);

 $('preview').src=c.toDataURL('image/jpeg',0.95);
 $('preview').style.display='block';
}
function descargar(){ const a=document.createElement('a'); a.download='producto-pro.jpg'; a.href=$('preview').src; a.click(); }
</script>
</body>
</html>
