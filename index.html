<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA Studio • Mejorar Producto</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{font-family:'Inter',sans-serif;background:radial-gradient(1200px 800px at 50% -10%, #fff8f0 0%, #faf6f1 40%, #f2ece5 100%);min-height:100vh;color:#2b2118;display:flex;flex-direction:column;align-items:center;padding:32px 18px}
 .brand{font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:6px;font-weight:600}
 .brand span{color:#c9a27a}
 .sub{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#9a8a7a;margin-top:6px}
 .card{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border:1px solid rgba(0,0,0,.06);border-radius:24px;padding:28px 22px;margin-top:26px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(180,140,100,.15)}
 .upload{border:2px dashed #d8c7b5;border-radius:18px;padding:28px 16px;cursor:pointer;transition:.2s;background:#fffdfa}
 .upload:hover{border-color:#c9a27a;background:#fff9f2}
 .upload p{font-size:15px;margin-top:10px}
 .upload small{color:#a08e7d}
  input[type=file]{display:none}
  #preview{width:100%;border-radius:18px;margin-top:18px;display:none;box-shadow:0 12px 35px rgba(0,0,0,.12)}
 .label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a08e7d;margin:20px 0 10px;text-align:left}
 .bg-row{display:flex;gap:10px}
 .bg-btn{flex:1;border:2px solid transparent;border-radius:14px;padding:0;height:62px;cursor:pointer;overflow:hidden;position:relative}
 .bg-btn.active{border-color:#111}
 .bg-btn small{position:absolute;bottom:6px;left:0;right:0;font-size:10px;letter-spacing:1px;background:rgba(255,255,255,.85)}
 .btn-primary{width:100%;background:#1a1310;color:#fff;border:0;padding:18px;border-radius:16px;font-size:16px;font-weight:600;letter-spacing:.5px;margin-top:20px;cursor:pointer;transition:.2s}
 .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 25px rgba(0,0,0,.2)}
 .btn-ghost{width:100%;background:transparent;border:1px solid #ddd5c9;padding:15px;border-radius:16px;margin-top:10px;font-size:15px;cursor:pointer}
  canvas{display:none}
 .tips{max-width:480px;margin-top:18px;font-size:12px;color:#9a8a7a;text-align:center;line-height:1.6}
</style>
</head>
<body>

<div class="brand">AURA<span>BEAUTY</span></div>
<div class="sub">Product Studio</div>

<div class="card">
  <label class="upload" for="in">
    <div style="font-size:38px">📸</div>
    <p><b>Tocá para subir la foto</b></p>
    <small>JPG o PNG • se procesa en tu celular</small>
  </label>
  <input type="file" id="in" accept="image/*" capture="environment">

  <img id="preview">
  <canvas id="c"></canvas>

  <div class="label">Fondo estudio</div>
  <div class="bg-row">
    <button class="bg-btn active" id="b1" style="background:#ffffff" onclick="setBg('#ffffff','b1')"><small>BLANCO</small></button>
    <button class="bg-btn" id="b2" style="background:#f6efe6" onclick="setBg('#f6efe6','b2')"><small>BEIGE AURA</small></button>
    <button class="bg-btn" id="b3" style="background:radial-gradient(circle at 50% 40%, #fff, #d4d4d4)" onclick="setBg('studio','b3')"><small>ESTUDIO</small></button>
  </div>

  <button class="btn-primary" onclick="mejorarPro()">✨ Mejorar foto profesionalmente</button>
  <button class="btn-ghost" onclick="descargar()">Descargar en HD</button>
</div>

<div class="tips">Iluminación balanceada • Color real • Sombra suave natural • Encuadre 1:1 listo para Instagram y tienda</div>

<script>
let img=new Image(), bg='#ffffff';
const $=id=>document.getElementById(id);
$('in').onchange=e=>{ const f=e.target.files[0]; if(!f) return; img.src=URL.createObjectURL(f); img.onload=()=>{ $('preview').src=img.src; $('preview').style.display='block'; } };

function setBg(v,id){ bg=v; document.querySelectorAll('.bg-btn').forEach(b=>b.classList.remove('active')); $(id).classList.add('active'); }

function mejorarPro(){
 if(!img.src){alert('Subí una foto primero');return;}
 const S=1600, c=$('c'), x=c.getContext('2d'); c.width=S; c.height=S;
 function pintarFondo(){
  if(bg==='studio'){ const g=x.createRadialGradient(S/2,S/2,150,S/2,S/2,S);
   g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d2d2d2'); x.fillStyle=g; }
  else x.fillStyle=bg;
  x.fillRect(0,0,S,S);
 }
 pintarFondo();
 x.filter='brightness(1.12) contrast(1.08) saturate(1.1)';
 x.shadowColor='rgba(0,0,0,0.28)'; x.shadowBlur=70; x.shadowOffsetY=40;
 const pad=S*0.16, r=Math.min((S-pad*2)/img.width,(S-pad*2)/img.height);
 const dw=img.width*r, dh=img.height*r;
 x.drawImage(img,(S-dw)/2,(S-dh)/2.95,dw,dh);
 x.filter='none'; x.shadowColor='transparent';
 const v=x.createRadialGradient(S/2,S/2,S*0.35,S/2,S/2,S*0.8);
 v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.07)');
 x.fillStyle=v; x.fillRect(0,0,S,S);
 $('preview').src=c.toDataURL('image/jpeg',0.96);
}
function descargar(){ const a=document.createElement('a'); a.download='aura-producto-pro.jpg'; a.href=$('preview').src; a.click(); }
</script>
</body>
</html>
